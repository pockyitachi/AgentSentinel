<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>在线经验验证 — 系统设计图</title>
<style>
  body { font-family: system-ui, -apple-system, "PingFang SC", sans-serif; max-width: 760px; margin: 40px auto; padding: 0 20px; color: #2C2C2A; background: #fff; }
  h2 { font-size: 18px; margin: 36px 0 6px; }
  p.cap { font-size: 13px; color: #5F5E5A; margin: 0 0 14px; }
  svg { display: block; width: 100%; height: auto; border: 0.5px solid #D3D1C7; border-radius: 12px; padding: 8px 0; box-sizing: border-box; }
  .t  { font-family: inherit; font-size: 14px; fill: #2C2C2A; }
  .th { font-family: inherit; font-size: 14px; font-weight: 500; fill: #2C2C2A; }
  .ts { font-family: inherit; font-size: 12px; fill: #5F5E5A; }
  .arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
  .leader { stroke: #888780; stroke-width: 1; stroke-dasharray: 4 3; fill: none; }
  g.c-gray > rect, rect.c-gray { fill: #F1EFE8; stroke: #B4B2A9; stroke-width: 0.5; }
  g.c-gray .th, g.c-gray .t { fill: #444441; }
  g.c-gray .ts { fill: #5F5E5A; }
  g.c-purple > rect, rect.c-purple { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
  g.c-purple .th, g.c-purple .t { fill: #3C3489; }
  g.c-purple .ts { fill: #534AB7; }
  rect.c-red { fill: #F7C1C1; stroke: #A32D2D; stroke-width: 0.5; }
  rect.c-green { fill: #C0DD97; stroke: #3B6D11; stroke-width: 0.5; }
</style>
</head>
<body>
<h1 style="font-size:22px">在线经验验证(RECANT)— 系统设计图</h1>

<h2>图 1 · 监控层怎么和现有 agent 共存</h2>
<p class="cap">观察流被旁路读取(不拦截);动作箭头直通(不干预);监控唯一的输出通道是上下文里的经验块。同步插在步与步之间,毫秒级,agent 零改动。</p>
<svg viewBox="0 0 680 470" role="img" xmlns="http://www.w3.org/2000/svg"><title>监控层与现有 agent 的共存方式</title><desc>Agent 与环境构成执行循环;监控层旁路读取观察流,只重写上下文中的经验块,不拦截动作,不改动 agent。</desc><defs><marker id="arrow1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="60" y="60" width="200" height="60" rx="8"/><text x="160" y="82" text-anchor="middle" dominant-baseline="central" class="th">Agent 模型</text><text x="160" y="103" text-anchor="middle" dominant-baseline="central" class="ts">一行代码不改</text></g>
<g class="c-gray"><rect x="60" y="350" width="200" height="60" rx="8"/><text x="160" y="372" text-anchor="middle" dominant-baseline="central" class="th">环境</text><text x="160" y="393" text-anchor="middle" dominant-baseline="central" class="ts">代码库 · 终端 · 测试</text></g>
<line x1="105" y1="124" x2="105" y2="344" class="arr" marker-end="url(#arrow1)"/>
<text x="115" y="240" class="ts" dominant-baseline="central">动作(不被拦截)</text>
<g class="c-purple"><rect x="280" y="170" width="160" height="150" rx="8"/><text x="360" y="192" text-anchor="middle" dominant-baseline="central" class="th">监控层(外挂)</text><text x="360" y="220" text-anchor="middle" dominant-baseline="central" class="ts">① 解析观察成事件</text><text x="360" y="244" text-anchor="middle" dominant-baseline="central" class="ts">② 归因到说法</text><text x="360" y="268" text-anchor="middle" dominant-baseline="central" class="ts">③ 证据分累加</text><text x="360" y="292" text-anchor="middle" dominant-baseline="central" class="ts">④ 重写经验块</text></g>
<rect x="480" y="60" width="160" height="310" rx="8" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="5 4"/>
<text x="560" y="78" text-anchor="middle" dominant-baseline="central" class="th">上下文窗口</text>
<g class="c-gray"><rect x="492" y="94" width="136" height="42" rx="4"/><text x="560" y="115" text-anchor="middle" dominant-baseline="central" class="t">任务描述</text></g>
<g class="c-purple"><rect x="492" y="148" width="136" height="94" rx="4"/><text x="560" y="180" text-anchor="middle" dominant-baseline="central" class="th">经验块</text><text x="560" y="206" text-anchor="middle" dominant-baseline="central" class="ts">监控唯一改写区</text></g>
<g class="c-gray"><rect x="492" y="256" width="136" height="62" rx="4"/><text x="560" y="278" text-anchor="middle" dominant-baseline="central" class="t">执行历史</text><text x="560" y="300" text-anchor="middle" dominant-baseline="central" class="ts">观察不断追加</text></g>
<path d="M260 380 L560 380 L560 326" fill="none" class="arr" marker-end="url(#arrow1)"/>
<text x="292" y="368" class="ts" dominant-baseline="central">观察</text>
<line x1="360" y1="380" x2="360" y2="326" class="leader" marker-end="url(#arrow1)"/>
<text x="370" y="350" class="ts" dominant-baseline="central">旁路读取</text>
<line x1="440" y1="196" x2="486" y2="196" class="arr" marker-end="url(#arrow1)"/>
<text x="444" y="182" class="ts" dominant-baseline="central">重写</text>
<path d="M480 90 L268 90" fill="none" class="arr" marker-end="url(#arrow1)"/>
<text x="310" y="76" class="ts" dominant-baseline="central">下一步的输入</text>
<text x="340" y="444" text-anchor="middle" dominant-baseline="central" class="ts">同步插在步间缝隙 · 毫秒级 · 不改 agent · 不拦动作 · 全程日志可重放</text>
</svg>

<h2>图 2 · 一次任务的解剖:说法状态随执行证据翻转</h2>
<p class="cap">上排:注入经验拆成三条说法;中排:agent 的六个执行步骤;下排:每条说法的状态条,列与步骤对齐——某步的观察直接决定正下方格子的颜色。紫色竖线 = 监控出手时刻;右下 = 任务结束写回。</p>
<svg viewBox="0 0 680 568" role="img" xmlns="http://www.w3.org/2000/svg"><title>一次任务中经验被在线验证的全过程</title><desc>注入的经验被拆成三条说法;agent 执行六步;每条说法的状态随观察证据翻转;监控在第五步撤销被推翻的说法并在任务结束写回经验库。</desc><defs><marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="270" y="40" width="140" height="40" rx="8"/><text x="340" y="60" text-anchor="middle" dominant-baseline="central" class="th">检索到的经验</text></g>
<line x1="340" y1="84" x2="137" y2="92" class="arr" marker-end="url(#arrow2)"/>
<line x1="340" y1="84" x2="340" y2="92" class="arr" marker-end="url(#arrow2)"/>
<line x1="340" y1="84" x2="543" y2="92" class="arr" marker-end="url(#arrow2)"/>
<g class="c-gray"><rect x="40" y="96" width="190" height="60" rx="8"/><text x="135" y="118" text-anchor="middle" dominant-baseline="central" class="th">说法1(实体)</text><text x="135" y="140" text-anchor="middle" dominant-baseline="central" class="ts">bug 在 utils/config.py</text></g>
<g class="c-gray"><rect x="245" y="96" width="190" height="60" rx="8"/><text x="340" y="118" text-anchor="middle" dominant-baseline="central" class="th">说法2(预言)</text><text x="340" y="140" text-anchor="middle" dominant-baseline="central" class="ts">跑 test_cli 能复现</text></g>
<g class="c-gray"><rect x="450" y="96" width="190" height="60" rx="8"/><text x="545" y="118" text-anchor="middle" dominant-baseline="central" class="th">说法3(步骤)</text><text x="545" y="140" text-anchor="middle" dominant-baseline="central" class="ts">先复现,再加 None 保护</text></g>
<line x1="135" y1="160" x2="88" y2="226" class="leader" marker-end="url(#arrow2)"/>
<line x1="340" y1="160" x2="288" y2="226" class="leader" marker-end="url(#arrow2)"/>
<text x="150" y="196" class="ts" dominant-baseline="central">照它行动(归因挂钩)</text>
<g class="c-gray"><rect x="40" y="230" width="93" height="56" rx="4"/><text x="86" y="250" text-anchor="middle" dominant-baseline="central" class="t">读 utils/</text><text x="86" y="271" text-anchor="middle" dominant-baseline="central" class="ts">无 config.py</text></g>
<g class="c-gray"><rect x="140" y="230" width="93" height="56" rx="4"/><text x="186" y="250" text-anchor="middle" dominant-baseline="central" class="t">搜 config</text><text x="186" y="271" text-anchor="middle" dominant-baseline="central" class="ts">移到 settings</text></g>
<g class="c-gray"><rect x="240" y="230" width="93" height="56" rx="4"/><text x="286" y="250" text-anchor="middle" dominant-baseline="central" class="t">跑 test_cli</text><text x="286" y="271" text-anchor="middle" dominant-baseline="central" class="ts">全绿 未复现</text></g>
<g class="c-gray"><rect x="340" y="230" width="93" height="56" rx="4"/><text x="386" y="250" text-anchor="middle" dominant-baseline="central" class="t">重跑测试</text><text x="386" y="271" text-anchor="middle" dominant-baseline="central" class="ts">仍绿,无进展</text></g>
<g class="c-purple"><rect x="440" y="230" width="93" height="56" rx="4"/><text x="486" y="250" text-anchor="middle" dominant-baseline="central" class="t">监控出手</text><text x="486" y="271" text-anchor="middle" dominant-baseline="central" class="ts">撤1·2 补反述</text></g>
<g class="c-gray"><rect x="540" y="230" width="93" height="56" rx="4"/><text x="586" y="250" text-anchor="middle" dominant-baseline="central" class="t">改 settings</text><text x="586" y="271" text-anchor="middle" dominant-baseline="central" class="ts">测试通过 ✓</text></g>
<line x1="436" y1="222" x2="436" y2="412" stroke="#7F77DD" stroke-width="1" stroke-dasharray="5 4" fill="none"/>
<rect x="40" y="330" width="93" height="20" rx="3" class="c-gray"/><text x="46" y="340" dominant-baseline="central" class="ts">说法1</text>
<rect x="140" y="330" width="93" height="20" rx="3" class="c-red"/>
<rect x="240" y="330" width="93" height="20" rx="3" class="c-red"/>
<rect x="340" y="330" width="93" height="20" rx="3" class="c-red"/>
<rect x="440" y="330" width="93" height="20" rx="3" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3"/>
<rect x="540" y="330" width="93" height="20" rx="3" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3"/>
<rect x="40" y="358" width="93" height="20" rx="3" class="c-gray"/><text x="46" y="368" dominant-baseline="central" class="ts">说法2</text>
<rect x="140" y="358" width="93" height="20" rx="3" class="c-gray"/>
<rect x="240" y="358" width="93" height="20" rx="3" class="c-red"/>
<rect x="340" y="358" width="93" height="20" rx="3" class="c-red"/>
<rect x="440" y="358" width="93" height="20" rx="3" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3"/>
<rect x="540" y="358" width="93" height="20" rx="3" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3"/>
<rect x="40" y="386" width="93" height="20" rx="3" class="c-gray"/><text x="46" y="396" dominant-baseline="central" class="ts">说法3</text>
<rect x="140" y="386" width="93" height="20" rx="3" class="c-gray"/>
<rect x="240" y="386" width="93" height="20" rx="3" class="c-gray"/>
<rect x="340" y="386" width="93" height="20" rx="3" class="c-gray"/>
<rect x="440" y="386" width="93" height="20" rx="3" class="c-gray"/>
<rect x="540" y="386" width="93" height="20" rx="3" class="c-green"/>
<line x1="585" y1="410" x2="585" y2="442" class="arr" marker-end="url(#arrow2)"/>
<g class="c-purple"><rect x="460" y="446" width="180" height="56" rx="8"/><text x="550" y="466" text-anchor="middle" dominant-baseline="central" class="th">任务结束:写回库</text><text x="550" y="488" text-anchor="middle" dominant-baseline="central" class="ts">说法1·2 → 负面条件</text></g>
<rect x="70" y="528" width="12" height="12" rx="2" class="c-gray"/><text x="88" y="534" dominant-baseline="central" class="ts">未验证</text>
<rect x="160" y="528" width="12" height="12" rx="2" class="c-red"/><text x="178" y="534" dominant-baseline="central" class="ts">被推翻</text>
<rect x="250" y="528" width="12" height="12" rx="2" class="c-green"/><text x="268" y="534" dominant-baseline="central" class="ts">被证实</text>
<rect x="340" y="528" width="12" height="12" rx="2" class="c-purple"/><text x="358" y="534" dominant-baseline="central" class="ts">监控动作</text>
<rect x="436" y="528" width="12" height="12" rx="2" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3"/><text x="454" y="534" dominant-baseline="central" class="ts">已撤出上下文</text>
</svg>
</body>
</html>
